# Streamlit Cloud 배포용 설정
# 앱 화면 > Settings > Secrets 칸에 이 내용을 실제 값으로 채워 붙여넣으세요.
# (로컬에서는 이 파일이 없어도 됩니다. 있으면 app_password 만 잠금에 쓰입니다.)

# 팀에게 알려줄 대시보드 비밀번호
app_password = "여기에비밀번호"

# 수집기가 광고 데이터를 올리는 시트 (이 값이 있으면 앱이 '클라우드 모드' 로 동작합니다)
ad_sheet_id = "여기에_광고시트_ID"
ad_worksheet_today = "KakaopayToday"     # 당일 실시간 (30분마다 갈아끼움)
ad_worksheet_closed = "KakaopayDaily"    # 마감된 과거 날짜 (날짜 단위로만 채움)

# 전환(DB) 시트
db_sheet_id = "1BTfbVKKCbe-6g2x3SQilnFAILMXB-Yj0C4GLG77o1r4"

# service_account.json 의 내용을 그대로 옮깁니다.
# private_key 는 따옴표 안에 한 줄로, 줄바꿈이 \n 인 상태 그대로 붙여넣으세요.
[gcp_service_account]
type = "service_account"
project_id = "kakaopay-dashboard"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "sheet-bot@kakaopay-dashboard.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."
